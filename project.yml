name: CabinDash
options:
  bundleIdPrefix: com.cabindash
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  CabinCore:
    path: CabinCore

# Signing (team, bundle id, signing style) lives in Config/Signing.xcconfig, with personal values in the
# git-ignored Config/Signing.local.xcconfig. Do not add DEVELOPMENT_TEAM or CODE_SIGN_STYLE here: a value
# set in this file would override the xcconfig.
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  CabinDash:
    type: application
    platform: iOS
    sources:
      - path: CabinDash
    dependencies:
      - package: CabinCore
        product: CabinCore
    settings:
      base:
        # Comes from Config/Signing.xcconfig (CABIN_BUNDLE_ID), so a personal id never has to be committed.
        PRODUCT_BUNDLE_IDENTIFIER: $(CABIN_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Cabin Dash
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: Cabin Dash uses your location to show your speed, heading and trip distance while you drive. Your location stays on this iPhone.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Every app Cabin Dash looks for must be listed here, or iOS says it is not installed.
        # scripts/check_schemes.py keeps this in step with Catalog.swift. Do not edit between the markers by hand.
        LSApplicationQueriesSchemes:
          # BEGIN SCHEMES
          - maps
          - comgooglemaps
          - waze
          - com.sygic.aura
          - spotify
          - music
          - youtubemusic
          - amazonmusic
          - pandora
          - deezer
          - tidal
          - soundcloud
          - siriusxm
          - iheartradio
          - tunein
          - podcasts
          - overcast
          - pktc
          - audible
          - libbyapp
          - ibooks
          - whatsapp
          - tg
          - fb-messenger
          - msteams
          - zoomus
          - weixin
          - spothero
          - chatgpt
          - claude
          # END SCHEMES
