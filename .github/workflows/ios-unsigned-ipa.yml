name: Unsigned IPA (manual)

# Builds an UNSIGNED .ipa of Cabin Dash, for people without a Mac who will sign it on their own computer with a
# free Apple ID using a tool such as Sideloadly or AltStore. See docs/DEVICE-INSTALL.md, route B.
#
# Run it only after "iOS build" is green. It is manual on purpose (Actions tab > this workflow > Run workflow),
# so it never spends macOS minutes by itself. It needs no secrets and no Apple account. Nothing in the .ipa is signed.
#
# Versions: every IPA is a beta numbered from this workflow's run number (run 21 is beta 2.1, run 22 is beta 2.2), with
# the run number as its build number. For a full release, type its version (for example 1.0) into "release_version" when
# starting the run. The version is written into the app (Settings > About) and the file name. See CHANGELOG.md.

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Leave empty for a beta (numbered from this run: run 22 is beta 2.2). For a full release, its version, e.g. 1.0"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  unsigned-ipa:
    name: Archive without signing
    runs-on: macos-26
    timeout-minutes: 40
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Prepare output folder
        run: mkdir -p ci-artifacts

      - name: Check repository layout and secrets
        run: python3 scripts/ci/check_repo.py

      - name: Set up Xcode and XcodeGen
        uses: ./.github/actions/setup-ios-toolchain

      - name: Generate the Xcode project (XcodeGen)
        run: xcodegen generate --spec project.yml 2>&1 | tee ci-artifacts/xcodegen.log

      - name: Check the generated project contains everything
        run: python3 scripts/ci/verify_generated_project.py

      - name: Work out the version
        id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        # A release version that is not numbers and dots stops the run here (the script exits 1, and bash's pipefail keeps it).
        run: python3 scripts/ci/app_version.py "$RUN_NUMBER" "$RELEASE_VERSION" | tee -a "$GITHUB_OUTPUT"

      - name: Archive for iOS devices without signing
        env:
          # Optional. The Client ID of your Spotify app (a public identifier, not a secret). Set it under
          # Settings > Secrets and variables > Actions > Variables. Left empty, the Spotify screen says it is not set up.
          SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
          APP_VERSION: ${{ steps.version.outputs.version }}
          APP_BUILD: ${{ steps.version.outputs.build }}
          APP_CHANNEL: ${{ steps.version.outputs.channel }}
        run: |
          xcodebuild archive \
            -project CabinDash.xcodeproj \
            -scheme CabinDash \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/CabinDash.xcarchive \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SPOTIFY_CLIENT_ID="$SPOTIFY_CLIENT_ID" \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$APP_BUILD" \
            CABIN_CHANNEL="$APP_CHANNEL" \
            2>&1 | tee ci-artifacts/xcodebuild-archive.log

      - name: Summarize archive
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/summarize_xcodebuild.py ci-artifacts/xcodebuild-archive.log --title "Unsigned archive"

      - name: Package the .ipa
        env:
          APP_LABEL: ${{ steps.version.outputs.label }}
          APP_BUILD: ${{ steps.version.outputs.build }}
          APP_SLUG: ${{ steps.version.outputs.slug }}
        run: |
          app="build/CabinDash.xcarchive/Products/Applications/CabinDash.app"
          if [ ! -d "$app" ]; then
            echo "::error title=Package .ipa::The archive does not contain $app. Applications that were found:"
            ls -R build/CabinDash.xcarchive/Products || true
            exit 1
          fi
          ipa="ci-artifacts/CabinDash-${APP_SLUG}.ipa"
          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          cp -R "$app" build/ipa/Payload/
          (cd build/ipa && zip -qry "../../$ipa" Payload)
          ls -l "$ipa"
          {
            echo "### Cabin Dash ${APP_LABEL} (build ${APP_BUILD}), unsigned IPA"
            echo
            echo "Built from commit \`${GITHUB_SHA}\`. Download **cabindash-${APP_SLUG}** from the Artifacts list below."
            echo "It is not signed. It will not install on an iPhone until a tool signs it with your Apple ID."
            echo "Settings > About in the app shows ${APP_LABEL} (build ${APP_BUILD}). What changed: CHANGELOG.md."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the .ipa
        uses: actions/upload-artifact@v4
        with:
          name: cabindash-${{ steps.version.outputs.slug }}
          path: ci-artifacts/CabinDash-${{ steps.version.outputs.slug }}.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa-logs-${{ github.run_number }}
          path: |
            ci-artifacts/*.log
            ci-artifacts/*.txt
          if-no-files-found: warn
          retention-days: 14
